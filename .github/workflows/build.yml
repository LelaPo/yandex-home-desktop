name: CI & Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на GitHub

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      # 1. Скачиваем исходный код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Node.js с кэшированием npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Настраиваем Rust
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 4. Умный кэш Rust (ускоряет повторные сборки в 3-4 раза)
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 5. Установка зависимостей frontend
      - name: Install dependencies
        run: npm ci

      # 6. Проверка TypeScript на ошибки типов
      - name: Typecheck Frontend
        run: npx tsc

      # 7. Сборка приложения через Tauri CLI
      - name: Build Tauri App
        run: npm run tauri build

      # 8. Сохраняем готовый .exe установщик в артефакты коммита
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yandex-home-desktop-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # 9. Если коммит был с тегом (например, v0.1.0), создаём официальный GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}