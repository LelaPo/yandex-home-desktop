name: CI / Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
  pull_request:
    branches: [main]
  workflow_dispatch: # Кнопка для ручной сборки .exe когда захочешь

jobs:
  # 1. БЫСТРАЯ ПРОВЕРКА (запускается всегда при коммитах в код)
  check:
    name: Fast Code Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc

      - name: Fast Rust Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # 2. ТЯЖЁЛАЯ СБОРКА .EXE (только вручную или при релизном теге v*)
  build-installer:
    name: Build Windows .exe
    needs: check
    # Сборка включится ТОЛЬКО если ты создал тег v* или нажал кнопку вручную
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm run tauri build

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandex-home-desktop-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}